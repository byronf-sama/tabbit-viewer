# XcodeGen spec for Tabbit. After adding or removing files, run `xcodegen generate`
# and commit the regenerated Tabbit.xcodeproj alongside this file.
name: Tabbit
options:
  bundleIdPrefix: io.github.byronf-sama
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Tabbit:
    type: application
    platform: macOS
    sources:
      - path: Tabbit
        excludes:
          - Resources/web
      # Built web bundle (npm run build in web/), copied into the app as a folder: Contents/Resources/web
      - path: Tabbit/Resources/web
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Tabbit
        PRODUCT_BUNDLE_IDENTIFIER: io.github.byronf-sama.tabbit
        INFOPLIST_FILE: Tabbit/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        # Ad-hoc signing: no Apple Developer account, no team, no sandbox.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        DEAD_CODE_STRIPPING: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES

schemes:
  Tabbit:
    build:
      targets:
        Tabbit: all
    run:
      config: Debug
    archive:
      config: Release
